<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OnCourt Case Tracking Dashboard - Track court cases through filing, summons, and warrant stages">
    <title>OnCourt - Case Tracking Dashboard</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">⚖️</span>
                    <span class="logo-text">OnCourt</span>
                    <span class="logo-subtitle">Case Tracking</span>
                </div>
                
                <div class="search-container">
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="Search by case number, petitioner, or respondent..."
                            autocomplete="off"
                        >
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Stats -->
                <section class="sidebar-section">
                    <h3 class="sidebar-title">Dashboard Stats</h3>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-value" id="statTotal">0</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat-card active">
                            <span class="stat-value" id="statActive">0</span>
                            <span class="stat-label">Active</span>
                        </div>
                        <div class="stat-card withdrawn">
                            <span class="stat-value" id="statWithdrawn">0</span>
                            <span class="stat-label">Withdrawn</span>
                        </div>
                        <div class="stat-card warrants">
                            <span class="stat-value" id="statWarrants">0</span>
                            <span class="stat-label">Warrants</span>
                        </div>
                    </div>
                </section>

                <!-- Filters -->
                <section class="sidebar-section">
                    <h3 class="sidebar-title">Filters</h3>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="stageFilter">Stage</label>
                        <select id="stageFilter" class="filter-select">
                            <option value="">All Stages</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label" for="statusFilter">Status</label>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Statuses</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="filter-label">Filing Date Range</label>
                        <div class="date-range">
                            <input type="date" id="dateFrom" class="filter-input" placeholder="From">
                            <input type="date" id="dateTo" class="filter-input" placeholder="To">
                        </div>
                    </div>
                    
                    <button id="clearFilters" class="btn-clear">
                        Clear All Filters
                    </button>
                </section>
            </aside>

            <!-- Cases Content -->
            <section class="content-area">
                <div class="content-header">
                    <span id="resultsCount" class="results-count">Loading cases...</span>
                </div>
                
                <div id="casesGrid" class="cases-grid">
                    <!-- Cases will be rendered here -->
                </div>
            </section>
        </main>

        <!-- Case Detail Modal -->
        <div id="caseModal" class="modal">
            <div class="modal-content" id="modalContent">
                <!-- Modal content will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
